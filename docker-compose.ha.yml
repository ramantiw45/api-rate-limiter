  # ─────────────────────────────────────────────────────────────────────────────
  # Prometheus – Metrics Scraper & Time-Series Engine
  # ─────────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: rate-limiter-prometheus-ha
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - gateway-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # Grafana – Visual Dashboards & Alerting Platform
  # ─────────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: rate-limiter-grafana-ha
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - gateway-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # k6 – Automated Load Testing Runner
  # ─────────────────────────────────────────────────────────────────────────────
  k6:
    image: grafana/k6:latest
    container_name: rate-limiter-k6-ha
    profiles:
      - load-test
    environment:
      GATEWAY_URL: http://gateway:8080
      API_KEY: my-secure-api-key
    volumes:
      - ./load-tests:/scripts
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge
