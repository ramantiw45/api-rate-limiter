services:

  # ─────────────────────────────────────────────────────────────────────────────
  # Redis Master (Active Read/Write Leader)
  # ─────────────────────────────────────────────────────────────────────────────
  redis-master:
    image: redis:7-alpine
    container_name: rate-limiter-redis-master
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --protected-mode no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gateway-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # Redis Replica (Hot Standby / Read-Only Synchronized Follower)
  # ─────────────────────────────────────────────────────────────────────────────
  redis-replica:
    image: redis:7-alpine
    container_name: rate-limiter-redis-replica
    ports:
      - "6380:6379"
    command: redis-server --replicaof redis-master 6379 --appendonly yes --protected-mode no
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gateway-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # Sentinel Quorum Node 1 (Port 26379)
  # ─────────────────────────────────────────────────────────────────────────────
  redis-sentinel-1:
    image: redis:7-alpine
    container_name: rate-limiter-sentinel-1
    ports:
      - "26379:26379"
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./docker/redis-ha/sentinel-entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - gateway-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # Sentinel Quorum Node 2 (Port 26380)
  # ─────────────────────────────────────────────────────────────────────────────
  redis-sentinel-2:
    image: redis:7-alpine
    container_name: rate-limiter-sentinel-2
    ports:
      - "26380:26379"
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./docker/redis-ha/sentinel-entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - gateway-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # Sentinel Quorum Node 3 (Port 26381)
  # ─────────────────────────────────────────────────────────────────────────────
  redis-sentinel-3:
    image: redis:7-alpine
    container_name: rate-limiter-sentinel-3
    ports:
      - "26381:26379"
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./docker/redis-ha/sentinel-entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - gateway-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # Zipkin – Distributed Tracing Backend & Web UI
  # ─────────────────────────────────────────────────────────────────────────────
  zipkin:
    image: openzipkin/zipkin:3
    container_name: rate-limiter-zipkin-ha
    ports:
      - "9411:9411"
    networks:
      - gateway-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # Spring Cloud Gateway – Dynamic Sentinel Failover Enabled
  # ─────────────────────────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rate-limiter-gateway-ha
    ports:
      - "8080:8080"
    environment:
      # Redis Sentinel High-Availability configuration
      SPRING_DATA_REDIS_SENTINEL_MASTER: mymaster
      SPRING_DATA_REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      # Distributed Tracing – export spans to Zipkin
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      # Local-development defaults
      ACTUATOR_USERNAME: ${ACTUATOR_USERNAME:-actuator}
      ACTUATOR_PASSWORD: ${ACTUATOR_PASSWORD:-change-me-local-only}
      API_KEY_SHA256_HASHES: ${API_KEY_SHA256_HASHES:-4c88089bdf15cb0dffde5c179461a2f99fa7cfb0bed250a8d87f8aa1d80eaa11}
      LOGGING_LEVEL_COM_API_RATELIMITER: INFO
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
      zipkin:
        condition: service_started
    networks:
      - gateway-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────────────────
  # Prometheus – Metrics Scraper & Time-Series Engine
  # ─────────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: rate-limiter-prometheus-ha
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - gateway-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # Grafana – Visual Dashboards & Alerting Platform
  # ─────────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: rate-limiter-grafana-ha
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - gateway-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # k6 – Automated Load Testing Runner
  # ─────────────────────────────────────────────────────────────────────────────
  k6:
    image: grafana/k6:latest
    container_name: rate-limiter-k6-ha
    profiles:
      - load-test
    environment:
      GATEWAY_URL: http://gateway:8080
      API_KEY: my-secure-api-key
    volumes:
      - ./load-tests:/scripts
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge
