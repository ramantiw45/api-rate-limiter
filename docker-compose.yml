services:

  # ─────────────────────────────────────────────────────────────────────────────
  # Redis 7 – Token Bucket state store
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rate-limiter-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    # Persist state every 60 s if at least 1 key changed; suppress noisy logs
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - gateway-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # Zipkin – Distributed Tracing Backend & Web UI
  # ─────────────────────────────────────────────────────────────────────────────
  zipkin:
    image: openzipkin/zipkin:3
    container_name: rate-limiter-zipkin
    ports:
      - "9411:9411"
    networks:
      - gateway-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # Spring Cloud Gateway – API Rate Limiter & Reverse Proxy
  # ─────────────────────────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rate-limiter-gateway
    ports:
      - "8080:8080"
    environment:
      # Override Spring Data Redis connection to reach the redis service
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Distributed Tracing – export spans to Zipkin
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      # Local-development defaults only. Override these values in .env for any
      # shared or deployed environment (see .env.example).
      ACTUATOR_USERNAME: ${ACTUATOR_USERNAME:-actuator}
      ACTUATOR_PASSWORD: ${ACTUATOR_PASSWORD:-change-me-local-only}
      # SHA-256("local-development-key"). The plaintext key is never passed to
      # the application; replace this digest in every non-local environment.
      API_KEY_SHA256_HASHES: ${API_KEY_SHA256_HASHES:-4c88089bdf15cb0dffde5c179461a2f99fa7cfb0bed250a8d87f8aa1d80eaa11}
      # Optional: bump to DEBUG for verbose gateway routing logs
      LOGGING_LEVEL_COM_API_RATELIMITER: INFO
    depends_on:
      redis:
        condition: service_healthy
      zipkin:
        condition: service_started
    networks:
      - gateway-net
    restart: unless-stopped
    healthcheck:
      # wget is available on Alpine; curl is not installed by default
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # allow JVM warm-up time

  # ─────────────────────────────────────────────────────────────────────────────
  # Prometheus – Metrics Scraper & Time-Series Engine
  # ─────────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: rate-limiter-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - gateway-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # Grafana – Visual Dashboards & Alerting Platform
  # ─────────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: rate-limiter-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - gateway-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # k6 – Automated Load Testing Runner
  # ─────────────────────────────────────────────────────────────────────────────
  k6:
    image: grafana/k6:latest
    container_name: rate-limiter-k6
    profiles:
      - load-test
    environment:
      GATEWAY_URL: http://gateway:8080
      API_KEY: my-secure-api-key
    volumes:
      - ./load-tests:/scripts
    networks:
      - gateway-net

# ─────────────────────────────────────────────────────────────────────────────
# Shared overlay network (bridge)
# ─────────────────────────────────────────────────────────────────────────────
networks:
  gateway-net:
    driver: bridge

# ─────────────────────────────────────────────────────────────────────────────
# Persistent volumes
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  redis-data:
  prometheus-data:
  grafana-data:
