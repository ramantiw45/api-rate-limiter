global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'api-rate-limiter'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 2s
    basic_auth:
      username: 'actuator'
      password: 'SuperSecretActuatorPass123!'
    static_configs:
      - targets: ['gateway:8080']
        labels:
          application: 'api-rate-limiter'
          environment: 'production'
